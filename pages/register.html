<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration — Glow Cart</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="brand">
            <h1>Glow Cart</h1>
            <p>Beauty & Beyond</p>
        </div>

        <div class="auth-heading">
            <h2>Create Account</h2>
        </div>

        <form id="registerForm">

            <div class="input-group">
                <input
                    type="text"
                    id="registerName"
                    placeholder="Full Name"
                    required
                >
            </div>

            <div class="input-group">
                <input
                    type="text"
                    id="registerUsername"
                    placeholder="User Name"
                    required
                >
            </div>

            <div class="input-group">
                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Email"
                    required
                >
            </div>

            <div class="input-group">
                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Password"
                    required
                >
            </div>

            <div class="input-group">
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Registration
            </button>

        </form>

        <a href="login.html" class="forgot-password">
            Already have an account? Login
        </a>

        <p id="registerMessage" class="auth-message"></p>

    </div>

</div>

<script src="../js/auth.js"></script>

</body>
</html>
