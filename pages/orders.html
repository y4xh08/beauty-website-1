<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="YASH MART My Orders">

    <title>My Orders | YASH MART</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .orders-section {
            padding: 50px 0 80px;
            background: #fcfafb;
            min-height: 75vh;
        }

        .orders-heading {
            margin-bottom: 25px;
        }

        .orders-heading h1 {
            margin: 5px 0 8px;
        }

        .orders-heading p {
            color: #777;
            font-size: 13px;
        }

        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .order-card {
            background: #fff;
            border: 1px solid #eadfe2;
            border-radius: 12px;
            overflow: hidden;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 17px 20px;
            background: #fff9fa;
            border-bottom: 1px solid #eadfe2;
        }

        .order-header-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .order-id {
            font-size: 13px;
            font-weight: 800;
        }

        .order-date {
            font-size: 10px;
            color: #888;
        }

        .order-status {
            padding: 6px 10px;
            border-radius: 20px;
            background: #eaf8ef;
            color: #267342;
            font-size: 10px;
            font-weight: 700;
        }

        .order-body {
            padding: 20px;
        }

        .order-products {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .order-product {
            display: flex;
            align-items: center;
            gap: 13px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f1eaec;
        }

        .order-product:last-child {
            border-bottom: 0;
            padding-bottom: 0;
        }

        .order-product-image {
            width: 55px;
            height: 55px;
            border-radius: 8px;
            background: #fff3f6;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            flex-shrink: 0;
        }

        .order-product-info {
            flex: 1;
        }

        .order-product-info strong {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .order-product-info span {
            font-size: 10px;
            color: #888;
        }

        .order-product-price {
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .order-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid #eadfe2;
        }

        .detail-box h3 {
            font-size: 12px;
            margin-bottom: 8px;
        }

        .detail-box p {
            color: #777;
            font-size: 11px;
            line-height: 1.7;
        }

        .order-total-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #faf6f7;
        }

        .order-total-box span {
            font-size: 12px;
        }

        .order-total-box strong {
            font-size: 17px;
        }

        .payment-status {
            display: inline-block;
            margin-top: 7px;
            padding: 5px 8px;
            border-radius: 5px;
            background: #f1f1f1;
            font-size: 9px;
            font-weight: 700;
        }

        .empty-orders {
            background: #fff;
            border: 1px solid #eadfe2;
            border-radius: 12px;
            text-align: center;
            padding: 65px 20px;
        }

        .empty-orders-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .empty-orders h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .empty-orders p {
            color: #777;
            font-size: 12px;
            margin-bottom: 20px;
        }

        .clear-orders-btn {
            border: 1px solid #e4d7da;
            background: #fff;
            color: #777;
            padding: 9px 14px;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            margin-top: 20px;
        }

        .clear-orders-btn:hover {
            border-color: #d94f70;
            color: #d94f70;
        }

        @media (max-width: 650px) {
            .order-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .order-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="container top-header">

        <a href="../index.html" class="logo">
            YASH <span>MART</span>
        </a>

        <div class="header-actions">

            <a href="wishlist.html" class="header-btn">
                <span>♡</span>
                <small>Wishlist</small>
            </a>

            <a href="cart.html" class="header-btn cart-button">
                <span>🛒</span>
                <small>Cart</small>
                <b id="cartCount">0</b>
            </a>

        </div>

    </div>

    <nav class="nav">

        <div class="container nav-inner">

            <a href="../index.html">
                Home
            </a>

            <a href="../index.html#categories">
                Categories
            </a>

            <a href="../index.html#offers">
                Offers
            </a>

        </div>

    </nav>

</header>

<main>

<section class="orders-section">

    <div class="container">

        <div class="orders-heading">

            <p class="eyebrow">
                YASH MART
            </p>

            <h1>
                My Orders
            </h1>

            <p>
                View your previous orders and delivery details.
            </p>

        </div>

        <div id="ordersList" class="orders-list"></div>

    </div>

</section>

</main>

<footer class="footer">

    <div class="container footer-content">

        <div>

            <a href="../index.html" class="logo footer-logo">
                YASH <span>MART</span>
            </a>

            <p>
                Beauty & Personal Care shopping made simple.
            </p>

        </div>

    </div>

    <div class="footer-bottom">
        © 2026 YASH MART. All rights reserved.
    </div>

</footer>

<script src="../data/products.js"></script>
<script src="../js/cart.js"></script>

<script>

const ordersList =
    document.getElementById("ordersList");

function formatOrderPrice(price) {

    return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 0
    }).format(price);

}

function formatOrderDate(dateString) {

    const date =
        new Date(dateString);

    return date.toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });

}

function renderOrders() {

    const orders =
        JSON.parse(
            localStorage.getItem("yashMartOrders")
        ) || [];

    if (orders.length === 0) {

        ordersList.innerHTML = `

            <div class="empty-orders">

                <div class="empty-orders-icon">
                    📦
                </div>

                <h2>
                    No orders yet
                </h2>

                <p>
                    Your placed orders will appear here.
                </p>

                <a
                    href="../index.html"
                    class="primary-btn">
                    Start Shopping
                </a>

            </div>

        `;

        return;
    }

    ordersList.innerHTML = "";

    [...orders].reverse().forEach(order => {

        const orderCard =
            document.createElement("article");

        orderCard.className =
            "order-card";

        const productsHTML =
            order.products.map(product => `

                <div class="order-product">

                    <div class="order-product-image">
                        ${product.image}
                    </div>

                    <div class="order-product-info">

                        <strong>
                            ${product.name}
                        </strong>

                        <span>
                            ${product.brand}
                            · Qty ${product.quantity}
                        </span>

                    </div>

                    <div class="order-product-price">
                        ${formatOrderPrice(
                            product.price *
                            product.quantity
                        )}
                    </div>

                </div>

            `).join("");

        orderCard.innerHTML = `

            <div class="order-header">

                <div class="order-header-left">

                    <div class="order-id">
                        Order ID: ${order.orderId}
                    </div>

                    <div class="order-date">
                        ${formatOrderDate(
                            order.createdAt
                        )}
                    </div>

                </div>

                <div class="order-status">
                    ${order.orderStatus}
                </div>

            </div>

            <div class="order-body">

                <div class="order-products">

                    ${productsHTML}

                </div>

                <div class="order-details">

                    <div class="detail-box">

                        <h3>
                            📍 Delivery Address
                        </h3>

                        <p>
                            ${order.customer.name}<br>
                            ${order.customer.mobile}<br>
                            ${order.address.address}<br>
                            ${order.address.city},
                            ${order.address.state}
                            - ${order.address.pincode}
                        </p>

                    </div>

                    <div class="detail-box">

                        <h3>
                            💳 Payment
                        </h3>

                        <p>
                            Method:
                            ${getPaymentMethodName(
                                order.paymentMethod
                            )}
                            <br>

                            Status:
                            ${order.paymentStatus}
                        </p>

                        <span class="payment-status">
                            ${order.paymentStatus}
                        </span>

                    </div>

                </div>

                <div class="order-total-box">

                    <span>
                        Total Amount
                    </span>

                    <strong>
                        ${formatOrderPrice(
                            order.total
                        )}
                    </strong>

                </div>

            </div>

        `;

        ordersList.appendChild(orderCard);

    });

    const clearButton =
        document.createElement("button");

    clearButton.className =
        "clear-orders-btn";

    clearButton.textContent =
        "Clear Demo Orders";

    clearButton.addEventListener("click", () => {

        const confirmClear =
            confirm(
                "Clear all demo orders?"
            );

        if (!confirmClear) {
            return;
        }

        localStorage.removeItem(
            "yashMartOrders"
        );

        renderOrders();

    });

    ordersList.appendChild(clearButton);

}

function getPaymentMethodName(method) {

    if (method === "upi") {
        return "UPI";
    }

    if (method === "card") {
        return "Card";
    }

    if (method === "cod") {
        return "Cash on Delivery";
    }

    return method || "Unknown";

}

renderOrders();
updateCartCount();

</script>

</body>
</html>
